<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monochrome Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #navbar {
      display: flex;
      gap: 10px;
      padding: 12px;
      background-color: #000000;
      border-bottom: 2px solid #ffffff;
      align-items: center;
    }
    .logo {
      font-weight: bold;
      letter-spacing: 2px;
      padding-right: 12px;
      border-right: 1px solid #444444;
      user-select: none;
    }
    input[type="text"] {
      flex: 1;
      background: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      background: #111111;
      box-shadow: 0 0 4px #ffffff;
    }
    button {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      padding: 8px 16px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    button:hover {
      background: #000000;
      color: #ffffff;
    }
    #viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: grayscale(100%) contrast(120%);
    }
  </style>
</head>
<body>

  <div id="navbar">
    <div class="logo">MONOCHROME</div>
    <input type="text" id="url-input" placeholder="Enter web address (e.g., example.com)" />
    <button onclick="navigate()">Go</button>
  </div>

  <div id="viewport">
    <iframe id="browser-frame" src="about:blank"></iframe>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');
    const browserFrame = document.getElementById('browser-frame');

    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') navigate();
    });

    function navigate() {
      let query = urlInput.value.trim();
      if (!query) return;

      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        query = 'https://' + query;
      }

      browserFrame.src = `/api/proxy?url=${encodeURIComponent(query)}`;
    }
  </script>
</body>
</html>
